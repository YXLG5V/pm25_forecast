<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PM2.5 Forecast</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #5f7dc4, #6fa3d6);
    margin: 0;
}

.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: #ffffff;
    border-radius: 16px;
    padding: 22px;
    margin-top: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    backdrop-filter: blur(4px);
}

canvas {
    width: 100% !important;
    height: 360px !important;
}

#location-select {
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
    width: 100%;
}

.explanation-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.up {
    color: #e74c3c;
}

.down {
    color: #37db34;
}

#explanations {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
}

.driver-card {
    background: #f4f7fb;
    border-radius: 12px;
    padding: 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
}

.driver-title {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 13px;
}

#station-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

#station-name a {
    text-decoration: none;
    border-bottom: 1px dashed rgba(0,0,0,0.3);
    transition: all 0.2s ease;
}

#station-name a:hover {
    border-bottom: 1px solid rgba(0,0,0,0.8);
}

#model-toggles {
    margin-top: 14px;
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 14px;
}

#model-toggles label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;

}

#recommendation-card {
    padding-top: 10px;
    padding-bottom: 10px;
}

</style>

</head>

<body>

<div class="container">
    <h1>Live PM2.5 Forecast - Győr</h1>

    <div class="card" id="aqi-card">

        <select id="location-select" onchange="loadData()">
            <option value="Gyor 2 Ifjusag">Győr - Ifjúság krt.</option>
            <option value="Gyor Ifjusag">Győri SZC Pálffy Miklós</option>
            <option value="Gyor Szent Istvan" selected>Győr - Szent István út</option>
            <option value="VS">Vámosszabadi</option>
        </select>

        <div id="top-row"
     style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        margin-top:12px;
     ">

    <div style="flex:1;"></div>

    <div id="model-toggles"
                style="
                    display:flex;
                    align-items:center;
                    gap:14px;
                    font-size:15px;
                ">

                <label style="opacity:0.75;">
                    <input
                        type="checkbox"
                        value="best"
                        checked
                        disabled
                        onclick="return false;"
                    >
                    Ensemble (ANN + Ridge)
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="lgbm"
                        onchange="toggleModel(this)"
                    >
                    LGBM
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="neuralnet"
                        onchange="toggleModel(this)"
                    >
                    NeuralNet
                </label>

            </div>
        </div>

        <div id="current">
            <div style="font-size:13px;color:#666;margin-bottom:4px;">Station:</div>

            <div id="station-row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                <div id="station-name" style="font-size:20px;font-weight:bold;"></div>
                <div id="station-meta" style="font-size:14px;white-space:nowrap;"></div>
            </div>
        </div>

    </div>

    <div class="card">
        <canvas id="chart"></canvas>
    </div>

    <div class="card" id="recommendation-card">
        <div id="recommendation"></div>
    </div>

    <div class="card">

        <h3 style="margin-bottom:6px;">
            Drivers of the forecast
        </h3>

        <div style="
            font-size:13px;
            color:#666;
            margin-bottom:14px;
        ">
            Feature contributions derived from the LGBM model (SHAP)
        </div>

        <div id="explanations"></div>

    </div>

</div>

<script>

let chart = null;
let cachedResponses = [];

const MODEL_COLORS = {
    best: "#f39c12",
    lgbm: "#2ecc71",
    neuralnet: "#ff00aa"
};
let recommendationWindow = null;

/* ===== AQI COLOR ===== */
function getAQIColor(pm25) {
    if (pm25 <= 12) return "#d4edda";
    if (pm25 <= 35) return "#fff3cd";
    if (pm25 <= 55) return "#ffe5b4";
    return "#f8d7da";
}

function isNight(datetime) {
    const hour = new Date(datetime).getHours();
    return (hour < 6 || hour >= 20);
}

function getWeatherIcon(code, datetime) {

    const night = isNight(datetime);

    if (code === 0) {
        return night ? "🌙" : "☀️";
    }

    // partly cloudy / overcast
    if ([1,2,3].includes(code)) {
        return night ? "☁️" : "⛅";
    }

    // fog
    if ([45,48].includes(code)) return "🌫️";

    // drizzle
    if ([51,53,55].includes(code)) {
        return night ? "🌧️" : "🌦️";
    }

    // freezing drizzle
    if ([56,57].includes(code)) return "🌧️❄️";

    // rain
    if ([61,63,65].includes(code)) return "🌧️";

    // freezing rain
    if ([66,67].includes(code)) return "🌧️❄️";

    // snow
    if ([71,73,75].includes(code)) return "❄️";

    // snow grains
    if (code === 77) return "🌨️";

    // rain showers
    if ([80,81,82].includes(code)) {
        return night ? "🌧️" : "🌦️";
    }

    // snow showers
    if ([85,86].includes(code)) return "🌨️";

    // thunderstorm
    if (code === 95) return "⛈️";

    // thunderstorm + hail
    if ([96,99].includes(code)) return "⛈️🧊";

    return "☁️"; // fallback
}
function toggleModel(checkbox) {

    if (!chart) return;

    const dataset = chart.data.datasets.find(
        d => d.modelKey === checkbox.value
    );

    if (!dataset) return;

    dataset.hidden = !checkbox.checked;

    chart.update('none');
}

async function loadData() {

    try {
        
        const location = document.getElementById("location-select").value;
        document.getElementById("station-name").innerText = "Loading...";
        document.getElementById("station-meta").innerText = "";

        const res = await fetch("/forecast_all", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                location_name: location
            })
        });

        const allData = await res.json();

        cachedResponses = Object.entries(allData.models).map(
            ([model, data]) => ({
                model,
                data
            })
        );

        const base = allData.models.best;
        
        const history = base.history || [];
        recommendationWindow = base.recommended_window;

        if (!history.length) return;

        // ===== CURRENT =====
        const last = history[history.length - 1];

        const lastTime = new Date(last.datetime);

        const lastWeather = history[history.length - 1]?.weather_code ?? -1;
        const weatherIcon = getWeatherIcon(lastWeather, last.datetime);

        // lokális formázás
        const timeStr = lastTime.toLocaleString("hu-HU", {
            hour: "2-digit",
            minute: "2-digit",
            day: "2-digit",
            month: "2-digit"
        });

        const mapsUrl =
            `https://www.google.com/maps?q=${allData.lat},${allData.lon}`;

        // bal oldal (station)
        document.getElementById("station-name").innerHTML =
            `<a href="${mapsUrl}" target="_blank" style="color:inherit;">
                ${location}
            </a>`;

        // jobb oldal (current value)
        document.getElementById("station-meta").innerHTML =
            `<strong>${last.pm25.toFixed(2)}</strong> µg/m³ · ${weatherIcon} · ${timeStr}`;

        document.getElementById("aqi-card").style.background =
            getAQIColor(last.pm25);

        // ===== DATA (history + forecast) =====

        const historyPoints = history.map(p => ({
            x: new Date(p.datetime),
            y: p.pm25,
            weather_code: p.weather_code
        }));

       
        const lastPoint = historyPoints[historyPoints.length - 1];

        const datasets = [
            {
                label: "History",
                data: historyPoints,
                borderColor: "#3498db",
                borderWidth: 3,
                tension: 0.3,
                pointRadius: 3,
                fill: false
            }
        ];

        cachedResponses.forEach(r => {

            const forecastPoints = r.data.forecast.map(p => ({
                x: new Date(p.datetime),
                y: p.pm25_pred,
                weather_code: p.weather_code
            }));

            const isBest = r.model === "best";
            const checkbox = document.querySelector(
                `#model-toggles input[value="${r.model}"]`
            );

            datasets.push({

                modelKey: r.model,

                hidden:
                    r.model !== "best" &&
                    checkbox &&
                    !checkbox.checked,

                label:
                    isBest
                        ? "Forecast (ANN + Ridge)"
                        : r.model === "lgbm"
                            ? "LGBM"
                            : "NeuralNet",

                data: [lastPoint, ...forecastPoints],

                borderColor: isBest
                    ? MODEL_COLORS[r.model]
                    : MODEL_COLORS[r.model] + "66",

                borderDash: isBest ? [] : [6,4],

                borderWidth: isBest ? 4 : 2,

                pointRadius: isBest ? 3 : 0,

                tension: 0.3,
                fill: false
            });

            });
        

        // ===== CHART =====
        if (!chart) {

            chart = new Chart(
                document.getElementById("chart"),
                {
                    type: "line",
                    data: {
                        datasets: datasets
                    },
                    options: {
                        layout: {
                            padding: {
                                bottom: 30 
                            }
                        },
                        responsive: true,
                        animation: false,

                        interaction: {
                            mode: 'nearest',
                            intersect: true
                        },

                        plugins: {
                            tooltip: {
                                mode: 'nearest',
                                intersect: true,
                                callbacks: {
                                    label: function(ctx) {
                                        return `${ctx.dataset.label}: ${ctx.raw.y.toFixed(1)} µg/m³`;
                                    }
                                }
                            },
                                legend: {
                                    display: true,
                                    labels: {
                                        usePointStyle: false,
                                        boxWidth: 40,
                                        padding: 16,
                                        font: {
                                            size: 14
                                        }
                                    }
                                }
                        },

                        scales: {
                            x: {
                                type: "time",
                                time: {
                                    unit: "hour",
                                    displayFormats: {
                                        hour: "HH:mm"
                                    }
                                },
                                ticks: {
                                    maxTicksLimit: 8,
                                    autoSkip: true,
                                    maxRotation: 0
                                }
                            },

                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: "PM2.5 (µg/m³)"
                                }
                            }
                        }
                    },

                    plugins: [{
                        id: 'recommendationHighlight',

                        afterDatasetsDraw(chart) {
                            if (!recommendationWindow) return;
                            if (!chart.chartArea) return; 

                            const { ctx, chartArea, scales } = chart;
                            const start = new Date(recommendationWindow.start);
                            const end = new Date(recommendationWindow.end);

                            const xStart = scales.x.getPixelForValue(start);
                            const xEnd = scales.x.getPixelForValue(end);

                            if (!isFinite(xStart) || !isFinite(xEnd)) return;

                            ctx.save();

                            // zöld sáv
                            ctx.fillStyle = 'rgba(46, 204, 113, 0.15)';
                            ctx.fillRect(
                                xStart,
                                chartArea.top,
                                xEnd - xStart,
                                chartArea.bottom - chartArea.top
                            );

                            ctx.restore();
                        }
                    },{
                        id: 'weatherIcons',

                        afterDraw(chart) {

                            const { ctx, scales, chartArea } = chart;
                            const xScale = scales.x;

                            const forecastDataset = chart.data.datasets.find(
                                d => d.modelKey === "best"
                            );
                            const historyDataset = chart.data.datasets[0];

                            ctx.save();

                            // ===== HISTORY (felső sor) =====
                            historyDataset.data.forEach((point, i) => {

                                if (point.weather_code == null) return;

                                const x = xScale.getPixelForValue(point.x);
                                const isNearTick = xScale.ticks.some(t => {
                                    const tx = xScale.getPixelForValue(t.value);
                                    return Math.abs(tx - x) < 10; // tolerancia
                                });
                                if (!isNearTick) return;

                                const y = chartArea.bottom + xScale.height + 20;

                                ctx.font = "16px Arial";
                                ctx.textAlign = "center";

                                ctx.fillText(
                                    getWeatherIcon(point.weather_code, point.x),
                                    x,
                                    y
                                );
                            });

                            // ===== FORECAST (alsó sor – ahogy most van) =====
                            forecastDataset.data.forEach((point, i) => {

                                if (point.weather_code == null) return;

                                const x = xScale.getPixelForValue(point.x);
                                const isNearTick = xScale.ticks.some(t => {
                                    const tx = xScale.getPixelForValue(t.value);
                                    return Math.abs(tx - x) < 10; // tolerancia
                                });
                                if (!isNearTick) return;

                                const y = chartArea.bottom + xScale.height + 20;

                                ctx.font = "16px Arial";
                                ctx.textAlign = "center";

                                ctx.fillText(
                                    getWeatherIcon(point.weather_code, point.x),
                                    x,
                                    y
                                );
                            });

                            ctx.restore();
                        }
                }]
                }
            );

        } else {

        chart.data.datasets = datasets;
        chart.update();
        }
        

         // ===== SHAP EXPLANATIONS (ALL HOURS) =====

        const container = document.getElementById("explanations");
        container.innerHTML = "";

        if (base.explanations && base.explanations.length) {

            base.explanations.forEach(hour => {

                const card = document.createElement("div");
                card.className = "driver-card";

                const time = new Date(hour.datetime)
                    .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const title = document.createElement("div");
                title.className = "driver-title";
                title.innerText = time;

                card.appendChild(title);

                hour.effects
                    .sort((a, b) => Math.abs(b.value) - Math.abs(a.value))
                    .slice(0, 5)
                    .forEach(e => {

                        const row = document.createElement("div");
                        row.className = "explanation-item";

                        const arrow = e.direction === "up" ? "↑" : "↓";
                        const cls = e.direction === "up" ? "up" : "down";

                        row.innerHTML = `
                            <span>${e.feature}</span>
                            <span class="${cls}">
                                ${Math.abs(e.value).toFixed(2)} ${arrow}
                            </span>
                        `;

                        card.appendChild(row);
                    });

                container.appendChild(card);
            });
        }

        if (base.recommended_window) {
        const rec = base.recommended_window;

        const start = new Date(rec.start);
        const end = new Date(rec.end);

        const format = (d) =>
            d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const icon = rec.weather_code != null
            ? getWeatherIcon(rec.weather_code, rec.start)
            : "";

        document.getElementById("recommendation").innerHTML = `
            <div style="
                padding:12px;
                border-radius:10px;
                background:#e6f4ea;
                font-size:15px;
                text-align: center
            ">
                ${rec.recommendation_text} ${icon}<br>
                <strong style="margin-left:3ch;">
                    ${format(start)} – ${format(end)}
                </strong>
                <span style="font-size:12px;color:#666;">
                    (lowest predicted air pollution)
                </span>
            </div>
        `;
    }else {
        document.getElementById("recommendation").innerHTML = "";
    }

    } catch (e) {
        console.error("Error loading forecast:", e);
    }
}

// initial load
loadData();

</script>

</body>
</html>
